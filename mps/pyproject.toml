[project]
name = "prime-rl-mps"
version = "0.1.0"
description = "Single-process Prime-RL experiments on Apple Silicon"
requires-python = "~=3.12.0"
dependencies = [
    "peft>=0.17.0",
    "pydantic>=2.11.0",
    "reverse-text",
    "torch>=2.9.0",
    "transformers>=5.6.2",
    "verifiers>=0.3.1.dev59",
]

[project.scripts]
mps-rl = "prime_rl_mps.train:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.2.1",
]

[tool.uv.sources]
reverse-text = { path = "../deps/verifiers/environments/reverse_text", editable = true }
verifiers = { path = "../deps/verifiers", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_rl_mps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
